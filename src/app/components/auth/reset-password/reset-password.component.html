<div class="reset-container">
    <div class="reset-card">
        <h2>Reset Password</h2>

        <div *ngIf="message" [class.success]="isSuccess" [class.error]="!isSuccess" class="alert">
            {{ message }}
        </div>

        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="!isSuccess && token">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" formControlName="password" placeholder="Enter new password">
                <div *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.invalid"
                    class="error-text">
                    Min 6 characters required.
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" formControlName="confirmPassword" placeholder="Confirm new password">
                <div *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched"
                    class="error-text">
                    Passwords do not match.
                </div>
            </div>

            <button type="submit" [disabled]="resetForm.invalid || isLoading">
                {{ isLoading ? 'Resetting...' : 'Set New Password' }}
            </button>
        </form>

        <div *ngIf="!token" class="error-text" style="text-align: center;">
            No token found in URL. Please use the link sent to your email.
        </div>
    </div>
</div>
